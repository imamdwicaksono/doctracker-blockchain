syntax = "proto3";

package proto;

option go_package = "doc-tracker/proto;proto";

/* =========================
   CORE DATA (TRACKER ONLY)
   ========================= */

message Checkpoint {
  repeated string emails = 1;      // support multi recipient
  string email = 2;                // legacy support
  string type = 3;
  string company = 4;
  string role = 5;
  bool is_viewable = 6;

  string note = 7;
  string encrypted_note = 8;
  map<string, string> encrypted_notes = 9;

  repeated string addresses = 10;
  string address = 11;

  string evidence_hash = 12;
  string evidence_path = 13;

  bool is_completed = 14;
  int64 completed_at = 15;
}

message Tracker {
  string id = 1;
  string type = 2;
  string privacy = 3;
  string creator = 4;
  string creator_addr = 5;
  int64 created_at = 6;

  repeated Checkpoint checkpoints = 7;

  string target_end = 8;
  string status = 9;

  map<string, string> encrypted_notes = 10;
}

/* =========================
   SYNC MESSAGES
   ========================= */

message TrackerList {
  repeated Tracker trackers = 1;
}

message Empty {}

message Pong {
  string message = 1;
}

/* =========================
   P2P SERVICE (FINAL)
   ========================= */

service P2PService {
  // Sync single tracker (idempotent)
  rpc SyncTracker (Tracker) returns (Empty);

  // Bulk mempool sync (optional)
  rpc SyncMempool (TrackerList) returns (Empty);

  // Health check
  rpc Ping (Empty) returns (Pong);

  rpc GetTrackers (Empty) returns (TrackerList); 
}
